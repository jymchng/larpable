# Deployment configuration for Larpable itself.
#
# Note the distinction: this file configures how *Larpable* is deployed, while the
# `netlify.toml` Larpable generates inside each user project is produced by
# `src/netlify/generator.ts` from the project's real framework, package manager,
# build command and output directory (PRD §8).
#
# Bun runs the build because `bun.lock` is the only lockfile in the repository and
# the guest uses Bun too, so one package manager is used end to end.

[build]
  # `prebuild` in package.json runs `bun run fetch:distros` first: the Linux image is
  # git-ignored, so a fresh checkout (this is how Netlify builds) has no
  # `public/distros/` and the app would load but refuse to boot. The fetch verifies the
  # image's SHA-256 against the release pinned to the installed unkernel version, and is
  # a no-op when the file is already valid.
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.13"
  NODE_VERSION = "22"
  # Ship both images the pinned unkernel release publishes, not just the one this app
  # boots by default (`DEFAULT_DISTRO_NAME` is debian). The release lists alpine
  # (4 046 848 bytes) beside debian (72 593 408), they share one abi/base, and each is
  # verified against the release's own SHA-256 by `scripts/fetch-distros.ts`. Measured
  # before this line existed: `GET /distros/alpine.erofs` on the live site answered
  # `404 text/html` — the image the site is supposed to have was not in the deploy, and
  # nothing but a deploy could tell you. 4 MB on top of 72 MB is worth a site whose
  # `/distros/` matches its own manifest.
  #
  # Local `bun run build` keeps the default (debian only) so a checkout stays small; set
  # the same variable locally to reproduce the deployed set exactly.
  LARPABLE_DISTROS = "debian,alpine"

# The OpenRouter proxy, in production.
#
# `vite.config.ts` installs `/api/openrouter` for the dev and preview servers, which is all a
# developer ever sees. A Netlify deploy is static files, so without this rule the path does not
# exist: measured, a **POST** to `/api/openrouter/chat/completions` was answered by Netlify's own
# `404 text/html` page (3984 bytes) — the SPA fallback below only catches GET — and the app
# printed that HTML page as "the model could not be reached". This rewrite hands the same path
# to `netlify/functions/openrouter.ts`, which forwards it to OpenRouter and adds the key from
# `LARPABLE_OPENROUTER_DEFAULT_API_KEY`. `force = true` so it wins over the SPA rule below, and
# it is declared first because Netlify evaluates redirects in order.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/openrouter/*"
  to = "/.netlify/functions/openrouter/:splat"
  status = 200
  force = true

# Cross-origin isolation is not optional: unkernel's worker transport and
# multi-CPU guests need SharedArrayBuffer, which browsers only expose to isolated
# pages. Without these two headers the app still loads but the guest must run on
# the page thread.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets are immutable; the HTML entry point must never be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The distro images are large and versioned by the resolved unkernel release, so
# they are cached hard but revalidated by the fetch script, not in the browser.
[[headers]]
  for = "/distros/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=86400"

# A missing distro file must be a real 404, not the SPA entry point. The catch-all at
# the bottom answers *every* unknown path with index.html and a 200 — and under the
# `/distros/*` cache rule above, that HTML was itself cacheable for a day, so a browser
# that asked before the images were deployed kept replaying "this deployment is missing
# public/distros/" long after the images were there. Real files still win this rule
# because it is not forced.
[[redirects]]
  from = "/distros/*"
  to = "/index.html"
  status = 404

# Single-page app: real files win, everything else falls back to the entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
