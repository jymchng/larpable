# Deployment configuration for Larpable itself.
#
# Note the distinction: this file configures how *Larpable* is deployed, while the
# `netlify.toml` Larpable generates inside each user project is produced by
# `src/netlify/generator.ts` from the project's real framework, package manager,
# build command and output directory (PRD §8).
#
# Bun runs the build because `bun.lock` is the only lockfile in the repository and
# the guest uses Bun too, so one package manager is used end to end.

[build]
  # `prebuild` in package.json runs `bun run fetch:distros` first: the Linux image is
  # git-ignored, so a fresh checkout (this is how Netlify builds) has no
  # `public/distros/` and the app would load but refuse to boot. The fetch verifies the
  # image's SHA-256 against the release pinned to the installed unkernel version, and is
  # a no-op when the file is already valid.
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.3.13"
  NODE_VERSION = "22"

# Cross-origin isolation is not optional: unkernel's worker transport and
# multi-CPU guests need SharedArrayBuffer, which browsers only expose to isolated
# pages. Without these two headers the app still loads but the guest must run on
# the page thread.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets are immutable; the HTML entry point must never be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The distro images are large and versioned by the resolved unkernel release, so
# they are cached hard but revalidated by the fetch script, not in the browser.
[[headers]]
  for = "/distros/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=86400"

# A missing distro file must be a real 404, not the SPA entry point. The catch-all at
# the bottom answers *every* unknown path with index.html and a 200 — and under the
# `/distros/*` cache rule above, that HTML was itself cacheable for a day, so a browser
# that asked before the images were deployed kept replaying "this deployment is missing
# public/distros/" long after the images were there. Real files still win this rule
# because it is not forced.
[[redirects]]
  from = "/distros/*"
  to = "/index.html"
  status = 404

# Single-page app: real files win, everything else falls back to the entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
